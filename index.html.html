<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parque Fijo LATAM — ZetaBé</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--y:#F5B800;--bg:#FAFAFA;--card:#fff;--brd:#E5E7EB;--txt:#111;--dim:#888;--ft:'Aptos Narrow','Arial Narrow','Bahnschrift','Segoe UI',system-ui,sans-serif;}
body{background:var(--bg);font-family:var(--ft);color:var(--txt);-webkit-font-smoothing:antialiased;}
.top-line{height:3px;background:linear-gradient(90deg,transparent,var(--y),transparent);}
.landing{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding-top:50px;}
.landing h1{font-size:76px;font-weight:900;line-height:.9;letter-spacing:-.03em;}
.landing h2{font-size:76px;font-weight:900;line-height:.9;letter-spacing:-.03em;color:var(--y);}
.sep{width:50px;height:3px;background:var(--y);border-radius:2px;margin:20px auto;}
.sub{font-size:16px;color:#777;line-height:1.7;max-width:400px;text-align:center;}
.toggle{display:flex;gap:4px;margin-top:28px;background:var(--card);border-radius:10px;border:1px solid var(--brd);padding:4px;}
.toggle button{font-size:15px;padding:10px 24px;border-radius:8px;border:none;cursor:pointer;font-family:var(--ft);font-weight:500;background:transparent;color:var(--dim);}
.toggle button.active{background:var(--y);font-weight:700;color:var(--txt);}
.cards{display:flex;gap:18px;margin-top:32px;flex-wrap:wrap;justify-content:center;padding-bottom:60px;}
.ccard{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:22px 26px;width:180px;cursor:pointer;transition:.25s;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.ccard:hover{border-color:var(--y);transform:translateY(-6px);box-shadow:0 12px 32px rgba(245,184,0,.13);}
.topbar{background:var(--card);border-bottom:1px solid var(--brd);padding:12px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar .back{background:none;border:none;cursor:pointer;font-size:15px;color:#999;font-family:var(--ft);font-weight:600;}
.topbar .back:hover{color:var(--y);}
.topbar .ctabs{display:flex;gap:4px;}
.topbar .ctabs button{border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:var(--ft);border:1px solid var(--brd);background:var(--card);color:var(--dim);font-weight:500;}
.topbar .ctabs button.active{background:var(--y);color:var(--txt);border:none;font-weight:700;}
.dash{padding:0 28px;max-width:1140px;margin:0 auto;}
.dash-header{text-align:center;padding:24px 0 8px;}
.dash-header h2{font-size:48px;font-weight:900;letter-spacing:-.02em;line-height:1;}
.dash-header .dcode{font-size:22px;font-weight:900;color:var(--y);letter-spacing:.05em;}
.scards{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.scard{border:1px solid var(--brd);border-radius:12px;padding:16px 20px;flex:1;min-width:130;background:var(--card);}
.scard.accent{background:#FFFBEB;border-color:#FDE68A;}
.scard .slbl{font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;margin-bottom:6px;}
.scard .sval{font-size:24px;font-weight:800;}
.scard .ssub{font-size:14px;color:#999;margin-top:4px;}
.panel{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:22px;margin-bottom:22px;}
.panel h3{font-size:17px;font-weight:700;margin-bottom:16px;}
.panel .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
.panel .total-r{font-size:20px;font-weight:800;color:var(--y);}
.panel .total-r span{font-size:14px;color:#bbb;}
/* Multi-select filter */
.mfilter{position:relative;display:inline-block;}
.mfilter .mbtn{font-size:14px;padding:7px 10px;border-radius:8px;border:1px solid #ddd;font-family:var(--ft);cursor:pointer;background:var(--card);color:#333;min-width:100px;text-align:left;display:flex;align-items:center;gap:4px;}
.mfilter .mbtn .cnt{background:var(--y);color:#111;border-radius:4px;padding:1px 5px;font-size:11px;font-weight:700;}
.mfilter .mdrop{position:absolute;top:100%;left:0;background:var(--card);border:1px solid var(--brd);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:100;min-width:180px;max-height:260px;overflow-y:auto;display:none;padding:4px 0;}
.mfilter .mdrop.open{display:block;} .mfilter{z-index:20;}
.mfilter .mdrop .mact{display:flex;gap:4px;padding:4px 8px;border-bottom:1px solid #f3f3f3;margin-bottom:4px;}
.mfilter .mdrop .mact button{font-size:11px;padding:3px 8px;border-radius:4px;border:1px solid #ddd;cursor:pointer;font-family:var(--ft);background:var(--card);}
.mfilter .mdrop label{display:flex;align-items:center;gap:6px;padding:4px 10px;font-size:13px;cursor:pointer;}
.mfilter .mdrop label:hover{background:#f9f9f9;}
.mfilter .mdrop input{accent-color:var(--y);}
.filters{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;align-items:center;padding:10px 14px;background:var(--card);border-radius:10px;border:1px solid var(--brd);}
.filters>span{font-size:14px;color:var(--dim);font-weight:700;}
.month-bars{display:flex;align-items:flex-end;gap:14px;position:relative;z-index:3;}
.month-bar{flex:1;text-align:center;}
.drow{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #F3F4F6;flex-wrap:wrap;}
.total-row{display:flex;align-items:center;gap:10px;padding-top:12px;border-top:2px solid var(--brd);flex-wrap:wrap;font-weight:800;}
.dtable{width:100%;border-collapse:collapse;font-size:13px;}
.dtable th{text-align:right;padding:8px 6px;color:var(--dim);font-weight:600;border-bottom:2px solid var(--brd);}
.dtable th:first-child{text-align:left;padding-left:10px;}
.dtable .crow{background:var(--bg);border-bottom:1px solid var(--brd);}
.dtable .crow td{padding:8px 6px;font-weight:700;}
.dtable .srow2 td{padding:6px 6px 6px 28px;color:#666;font-size:12px;border-bottom:1px solid #F3F4F6;}
.dtable tfoot tr{border-top:2px solid var(--brd);background:#FFFBEB;}
.dtable tfoot td{padding:10px 6px;font-weight:800;}
.map-wrap{display:flex;gap:24px;margin-top:32px;width:100%;max-width:950px;padding:0 28px 60px;align-items:flex-start;flex-wrap:wrap;}
.map-img-wrap{flex:0 0 360px;position:relative;}
.map-img-wrap img{width:100%;border-radius:12px;}
.map-pin{position:absolute;transform:translate(-50%,-50%);cursor:pointer;text-align:center;transition:.2s;z-index:2;}
.map-pin:hover{transform:translate(-50%,-50%) scale(1.1);}
.map-pin-inner{background:#111;color:#fff;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.3);}
.map-pin-arrow{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid #111;margin:0 auto;}
.summary-list{flex:1;min-width:280px;}
.srow{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:14px 18px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:.2s;}
.srow:hover{border-color:var(--y);transform:translateX(4px);}
.clear-btn{font-size:12px;color:#EF4444;background:#FEF2F2;border:1px solid #FECACA;border-radius:6px;padding:5px 10px;cursor:pointer;font-family:var(--ft);font-weight:600;}
/* Weekly chart */
.wk-bars{display:flex;align-items:flex-end;gap:2px;height:120px;}
.wk-bar{flex:1;background:var(--y);border-radius:3px 3px 0 0;transition:.3s;min-width:4px;cursor:pointer;position:relative;}
.wk-bar:hover{opacity:.8;}
.wk-tip{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:4px 8px;border-radius:4px;font-size:11px;white-space:nowrap;z-index:10;}
.wk-bar:hover .wk-tip{display:block;}
</style>
</head>

// Create multi-select dropdown
function mkFilter(label,key,options,container){
  var wrap=document.createElement("div");wrap.className="mfilter";
  var btn=document.createElement("button");btn.className="mbtn";btn.type="button";
  var sel=getFilter(key);
  var txt=sel?(sel.length===0?"0":sel.length+" sel"):"Todos";
  btn.innerHTML=label+': <span class="cnt">'+txt+'</span>';
  
  var drop=document.createElement("div");drop.className="mdrop";
  var acts=document.createElement("div");acts.className="mact";
  var selAll=document.createElement("button");selAll.type="button";selAll.textContent="Todo";
  selAll.onclick=function(e){e.preventDefault();e.stopPropagation();setFilter(key,null);};
  var clrAll=document.createElement("button");clrAll.type="button";clrAll.textContent="Ninguno";
  clrAll.onclick=function(e){e.preventDefault();e.stopPropagation();setFilter(key,[]);};
  acts.appendChild(selAll);acts.appendChild(clrAll);
  drop.appendChild(acts);

  options.forEach(function(o){
    var lbl=document.createElement("label");
    var cb=document.createElement("input");cb.type="checkbox";
    cb.checked=!sel||sel.indexOf(o)>=0;
    cb.onchange=function(e){
      e.stopPropagation();
      var cur=getFilter(key)?getFilter(key).slice():options.slice();
      if(cb.checked){if(cur.indexOf(o)<0)cur.push(o);}
      else{cur=cur.filter(function(x){return x!==o;});}
      if(cur.length>=options.length)setFilter(key,null);
      else setFilter(key,cur);
    };
    var display=typeof o==="number"?(MN[o]||o):o;
    lbl.appendChild(cb);lbl.appendChild(document.createTextNode(" "+String(display)));
    drop.appendChild(lbl);
  });

  btn.onclick=function(e){
    e.preventDefault();e.stopPropagation();
    // Close all other dropdowns first
    document.querySelectorAll(".mdrop.open").forEach(function(d){if(d!==drop)d.classList.remove("open");});
    drop.classList.toggle("open");
  };
  wrap.onclick=function(e){e.stopPropagation();};
  wrap.appendChild(btn);wrap.appendChild(drop);
  container.appendChild(wrap);
}

  row.innerHTML='<div style="width:10px;height:10px;border-radius:3px;background:'+PAL[i%PAL.length]+';flex-shrink:0"></div><div style="min-width:120px"><div style="font-size:15px;font-weight:700;color:#222">'+s.n+'</div><div style="font-size:12px;color:#aaa">'+s.sop+' sop'+(s.cits.length?' · '+s.cits.join(", "):'')+'</div></div><div style="font-size:16px;font-weight:800;color:#111;margin-left:auto">$ '+fN(s.inv)+'</div><div style="font-size:15px;font-weight:800;color:'+PAL[i%PAL.length]+';width:55px;text-align:right">'+s.sh+'%</div><div style="width:100%;max-width:200px;height:12px;background:#F3F4F6;border-radius:6px;overflow:hidden"><div style="height:100%;width:'+bw+'%;background:'+PAL[i%PAL.length]+';border-radius:6px"></div></div>';
  scp.appendChild(row);});
  var tr2=document.createElement("div");tr2.className="total-row";tr2.innerHTML='<div style="width:10px"></div><div style="min-width:120px">TOTAL</div><div style="font-size:17px;font-weight:900;color:var(--y);margin-left:auto">$ '+fN(tInv)+'</div><div style="font-size:15px;width:55px;text-align:right">100%</div><div style="flex:1"></div>';
  scp.appendChild(tr2);dash.appendChild(scp);

  // PROVIDERS
  var pM={};filtered.forEach(function(r){if(!r.p)return;if(!pM[r.p])pM[r.p]={n:r.p,inv:0,ids:{}};pM[r.p].inv+=r.v;pM[r.p].ids[r.id]=1;});
  var byPr=Object.values(pM).sort(function(a,b){return b.inv-a.inv;}).map(function(x){return{n:x.n,inv:x.inv,sh:tInv?Math.round(x.inv/tInv*1000)/10:0,sop:Object.keys(x.ids).length};});
  var maxPr=byPr.length?byPr[0].inv:1;
  var pp=document.createElement("div");pp.className="panel";pp.innerHTML='<h3>Proveedores</h3>';
  byPr.forEach(function(p,i){var bw=maxPr?(p.inv/maxPr)*100:0;var row=document.createElement("div");row.className="drow";
  row.innerHTML='<div style="width:8px;height:8px;border-radius:2px;background:'+PAL[i%PAL.length]+';flex-shrink:0"></div><div style="min-width:120px"><div style="font-size:15px;font-weight:600;color:#222">'+p.n+'</div><div style="font-size:12px;color:#aaa">'+p.sop+' soportes</div></div><div style="font-size:16px;font-weight:800;color:#111;margin-left:auto">$ '+fN(p.inv)+'</div><div style="font-size:14px;font-weight:700;color:'+PAL[i%PAL.length]+';width:50px;text-align:right">'+p.sh+'%</div><div style="width:100%;max-width:180px;height:10px;background:#F3F4F6;border-radius:5px;overflow:hidden"><div style="height:100%;width:'+bw+'%;background:'+PAL[i%PAL.length]+';border-radius:5px"></div></div>';
  pp.appendChild(row);});
  var tr3=document.createElement("div");tr3.className="total-row";tr3.innerHTML='<div style="width:8px"></div><div style="min-width:120px">TOTAL</div><div style="font-size:17px;font-weight:900;color:var(--y);margin-left:auto">$ '+fN(tInv)+'</div><div style="font-size:14px;width:50px;text-align:right">100%</div><div style="flex:1"></div>';
  pp.appendChild(tr3);dash.appendChild(pp);

  // TABLE
  var allM2=uniq(cRecs,"m").filter(function(m){return m>0;}).sort(function(a,b){return a-b;});
  var cMap={};filtered.forEach(function(r){if(!cMap[r.ca])cMap[r.ca]={n:r.ca,subs:{}};if(!cMap[r.ca].subs[r.sc])cMap[r.ca].subs[r.sc]={n:r.sc,months:{},total:0};var k=r.m||0;if(!cMap[r.ca].subs[r.sc].months[k])cMap[r.ca].subs[r.sc].months[k]=0;cMap[r.ca].subs[r.sc].months[k]+=r.v;cMap[r.ca].subs[r.sc].total+=r.v;});
  var cArr=Object.values(cMap).sort(function(a,b){var aT=0,bT=0;Object.values(a.subs).forEach(function(s){aT+=s.total;});Object.values(b.subs).forEach(function(s){bT+=s.total;});return bT-aT;});
  var tp=document.createElement("div");tp.className="panel";tp.style.overflowX="auto";tp.innerHTML='<h3>Campaña › Subcampaña × Mes</h3>';
  var tbl=document.createElement("table");tbl.className="dtable";
  var th='<tr><th style="text-align:left">Campaña / Subcampaña</th>';allM2.forEach(function(m){th+='<th style="min-width:70px">'+(MN[m]||m)+'</th>';});th+='<th style="color:var(--y)">Total</th><th>Share</th></tr>';
  tbl.innerHTML='<thead>'+th+'</thead>';
  var tb=document.createElement("tbody");
  cArr.forEach(function(camp){var cT=0;Object.values(camp.subs).forEach(function(s){cT+=s.total;});var subs=Object.values(camp.subs).sort(function(a,b){return b.total-a.total;});
  var sn=camp.n.split("_").length>4?camp.n.split("_").slice(4).join(" "):camp.n;
  var cr=document.createElement("tr");cr.className="crow";var html='<td style="padding-left:10px" title="'+camp.n+'">'+sn+'</td>';
  allM2.forEach(function(m){var v=0;subs.forEach(function(s){v+=(s.months[m]||0);});html+='<td style="text-align:right;color:'+(v?"#333":"#ddd")+'">'+(v?fM(v):"—")+'</td>';});
  html+='<td style="text-align:right;color:var(--y);font-weight:800">'+fM(cT)+'</td><td style="text-align:right;color:#555">'+(tInv?Math.round(cT/tInv*1000)/10:0)+'%</td>';cr.innerHTML=html;tb.appendChild(cr);
  subs.forEach(function(sub){var sr=document.createElement("tr");sr.className="srow2";var sh='<td style="padding-left:10px">└ '+sub.n+'</td>';
  allM2.forEach(function(m){var v=sub.months[m]||0;sh+='<td style="text-align:right;color:'+(v?"#888":"#ddd")+'">'+(v?fM(v):"—")+'</td>';});
  sh+='<td style="text-align:right;font-weight:600;color:#333">$ '+fN(sub.total)+'</td><td style="text-align:right;color:#999">'+(tInv?Math.round(sub.total/tInv*1000)/10:0)+'%</td>';sr.innerHTML=sh;tb.appendChild(sr);});});
  tbl.appendChild(tb);
  var tf=document.createElement("tfoot");var tfr=document.createElement("tr");var tfh='<td style="padding-left:10px">TOTAL</td>';
  allM2.forEach(function(m){var v=0;filtered.forEach(function(r){if(r.m===m)v+=r.v;});tfh+='<td style="text-align:right">'+(v?fM(v):"—")+'</td>';});
  tfh+='<td style="text-align:right;color:var(--y);font-size:15px">$ '+fN(tInv)+'</td><td style="text-align:right">100%</td>';tfr.innerHTML=tfh;tf.appendChild(tfr);tbl.appendChild(tf);
  tp.appendChild(tbl);dash.appendChild(tp);

  var foot=document.createElement("div");foot.style.cssText="padding:16px 0 32px;text-align:center;font-size:12px;color:#ccc";foot.textContent="Zetabé — Parque Fijo LATAM — Dashboard OOH 2026";dash.appendChild(foot);
  app.appendChild(dash);
}

document.addEventListener("click",function(){document.querySelectorAll(".mdrop.open").forEach(function(d){d.classList.remove("open");});});
render();
</script>
